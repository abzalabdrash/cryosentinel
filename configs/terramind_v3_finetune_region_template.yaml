# ══════════════════════════════════════════════════════════════════════════
# CryoSentinel — Stage 4c: PER-REGION fine-tune TEMPLATE.
# Created: 2026-05-11. Part of AMBITION MODE Tier B (§17 of PROGRESS.md).
#
# PURPOSE
# -------
# Given a strong Stage 4a v2 pretrain (val/iou ≥ 0.89 on HMA-wide), this
# template fine-tunes a SEPARATE head per region. Each per-region model
# pushes +1-3 pp over the generic pretrain by specialising to:
#   * region-specific spectral signature (Karakoram debris-covered ice,
#     Tibetan turquoise glacial lakes, etc.)
#   * region-specific lake-size distribution
#   * region-specific cloud / snow / shadow co-occurrence
#
# Public release note:
#   This template records the intended per-region finetune recipe. Internal
#   launch automation is not part of the public repository.
#
# RECIPE PHILOSOPHY
# -----------------
# Per-region fine-tune should be CONSERVATIVE — we already have a strong
# pretrain, the risk is forgetting general features. So:
#   * Shorter schedule (15 epochs vs 30 in pretrain)
#   * Lower peak LR (3e-5 vs 6e-5)
#   * Stronger LLRD decay (0.85 vs 0.9 in finetune_almaty_v2)
#   * Light augmentation (avoid spectral_jitter that fights region-specific
#     spectral statistics we WANT to learn)
#   * Heavier EMA (decay 0.9997) for late-stage stability
# ═══════════════════════════════════════════════════════════════════════════

# NOTE: Fields marked with `# ▸ overridden per region` are programmatic
# defaults that the launcher script replaces. Keep them present so the
# template parses as valid YAML when used standalone.

run_name: terramind_v3_finetune_REGION_PLACEHOLDER   # ▸ overridden per region
output_dir: outputs/terramind
seed: 42
run_test: true

# ─────────────────────────────────────────────────────────────────────
# DATA — ONE region per fine-tune
# ─────────────────────────────────────────────────────────────────────
data:
  data_dir: data/processed/multimodal_chips_v3
  regions:
    - REGION_PLACEHOLDER                            # ▸ overridden per region
  years: [2017, 2021, 2022, 2023]

  batch_size: 8
  num_workers: 0
  augment: true
  rot90: false
  include_unknown_in_train: true
  shard_cache_size: 50
  pin_memory: false
  persistent_workers: false
  shuffle_train: true

  norm_stats_path: data/processed/multimodal_chips_v3/dataset_stats_v3.json

  # Finer block split — single region has only ~20-40 blocks at 0.25°,
  # so we go finer to spread val/test variance.
  use_block_split: true
  block_size_deg: 0.12
  block_buffer_deg: 0.02
  block_salt: cryosentinel-blocks-v1

  # ── Conservative augmentation (do NOT fight region-specific spectra)
  spectral_jitter:
    p: 0.3
    eps_s2: 0.02
    eps_s1: 0.05
    eps_dem: 0.02
  multi_scale:
    p: 0.3
    scale_min: 0.85
    scale_max: 1.15
  copy_paste:
    p: 0.15
    min_donor_water_pixels: 32
    sub_sample_frac: 1.0

  hard_neg_sampler:
    positive_to_negative_ratio: 3.0
    replacement: true
  hard_neg_water_frac_threshold: 0.002

# ─────────────────────────────────────────────────────────────────────
# MODEL
# ─────────────────────────────────────────────────────────────────────
model:
  backbone: terramind_v1_large
  modalities: [S2L2A, S1GRD, DEM]
  decoder: UperNetDecoder
  decoder_kwargs:
    decoder_channels: 256
    decoder_scale_modules: true

  backbone_pretrained: true

  # Conservative per-region: unfreeze top half only (blocks 12-23 + decoder)
  # so we keep the broadly-learned features from Stage 4a v2 pretrain.
  # block 11 sees gentle nudges via LLRD, blocks 0-11 are hard-frozen.
  freeze_backbone_layers: 12
  backbone_lr_mult: 0.2
  llrd_decay: 0.85

  lr: 3.0e-5                  # lower peak — we're already close to optimum
  weight_decay: 1.0e-4

  # ── Loss (kept same recipe as v2 — works well)
  loss_type: mega
  w_bce: 0.5
  w_focal: 1.0
  w_dice: 1.0
  w_tversky: 0.5
  w_boundary: 0.5
  w_lovasz: 0.3
  focal_alpha: 0.25
  focal_gamma: 2.0
  tversky_alpha: 0.25
  tversky_beta: 0.75
  lovasz_per_image: true
  pos_weight_max: 100.0

  label_smoothing: 0.0
  ohem_keep_ratio: 0.5
  ohem_min_kept: 4096
  dice_variant: flat

  val_tta: true
  test_tta: true

  compile_model: true

# ─────────────────────────────────────────────────────────────────────
# TRAINER
# ─────────────────────────────────────────────────────────────────────
trainer:
  # 15 epochs — shorter than v2 finetune because:
  # 1. We start from a much stronger init (Stage 4a v2 with val/iou>0.89)
  # 2. We're specialising on a single region (much less data per epoch)
  # 3. Excessive epochs would overfit to a small region's val set
  max_epochs: 15
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 25
  check_val_every_n_epoch: 1

  early_stopping_patience: 8
  checkpoint_every_n_steps: 500

  ema:
    decay: 0.9997               # heavier EMA for stability on small data
    apply_at_validation: true
    apply_at_test: true
    cpu_shadow: true
    skip_buffers: true

  # SWA covers last ~6 epochs — enough for the +0.3-0.5 pp bonus,
  # not so long that we drift from the strong pretrain init.
  swa:
    swa_epoch_start: 0.6
    swa_lrs: 5.0e-6
    annealing_epochs: 3
    annealing_strategy: cos
